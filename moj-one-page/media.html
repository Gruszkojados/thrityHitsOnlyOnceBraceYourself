<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Media Player</title>

<style>
    * {
        box-sizing: border-box;
    }

    

    /* GŁÓWNE OKNO */
    .media-player {
        width: 520px;
        background: #d4d0c8;
        border: 2px solid #ffffff;
        border-right-color: #404040;
        border-bottom-color: #404040;
        box-shadow: 4px 4px 0 #000;
    }

    /* BELKA TYTUŁOWA */
    .title-bar {
        height: 30px;
        padding: 3px 4px;
        display: flex;
        align-items: center;
        color: white;
        font-weight: bold;
        font-size: 13px;

        background:
            linear-gradient(
                to right,
                #0a246a,
                #3a6ea5 70%,
                #0a246a
            );
    }

    .title-icon {
        width: 22px;
        height: 22px;
        margin-right: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
    }

    .title-text {
        flex: 1;
    }

    .window-buttons {
        display: flex;
        gap: 2px;
    }

    .window-button {
        width: 20px;
        height: 20px;
        padding: 0;
        font-weight: bold;
        line-height: 16px;
        background: #d4d0c8;
        border: 1px solid #fff;
        border-right-color: #404040;
        border-bottom-color: #404040;
        cursor: pointer;
    }

    /* MENU */
    .menu-bar {
        height: 25px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 8px;
        border-bottom: 1px solid #808080;
        font-size: 12px;
    }

    .menu-bar span {
        cursor: default;
    }

    /* EKRAN */
    .screen {
        margin: 8px;
        height: 285px;
        background: #111;
        border: 3px solid #808080;
        border-top-color: #404040;
        border-left-color: #404040;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;

        background:
            repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.035) 0px,
                rgba(255,255,255,0.035) 1px,
                transparent 1px,
                transparent 4px
            );
    }

    .gif-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gif-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    /* PLACEHOLDER JEŚLI NIE MA GIF */
    .gif-placeholder {
        color: #00ff66;
        text-align: center;
        font-family: "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        padding: 20px;
    }

    /* INFORMACJE O UTWORZE */
    .track-info {
        margin: 0 8px 8px;
        height: 38px;
        padding: 5px 8px;

        background: #000;
        color: #00ff66;

        border: 2px solid #808080;
        border-top-color: #404040;
        border-left-color: #404040;

        font-family: "Courier New", monospace;
        font-size: 11px;

        display: flex;
        align-items: center;
    }

    .track-name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* PASEK POSTĘPU */
    .progress-area {
        padding: 0 8px 8px;
    }

    .progress-bar {
        height: 12px;
        background: #ffffff;

        border: 2px solid #808080;
        border-top-color: #404040;
        border-left-color: #404040;

        overflow: hidden;
    }

    .progress-fill {
        width: 0%;
        height: 100%;
        background: #316ac5;
        transition: width 0.1s linear;
    }

    /* DOLNY PANEL */
    .controls {
        height: 58px;
        padding: 7px 8px;

        display: flex;
        align-items: center;
        gap: 7px;

        border-top: 1px solid #ffffff;
    }

    .control-button {
        min-width: 78px;
        height: 32px;

        padding: 3px 12px;

        background: #d4d0c8;

        border: 2px solid #ffffff;
        border-right-color: #404040;
        border-bottom-color: #404040;

        font-family: Tahoma, Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;

        cursor: pointer;
    }

    .control-button:active {
        border: 2px solid #404040;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;

        padding-top: 5px;
        padding-left: 14px;
    }

    .control-button.playing {
        background: #c0c0c0;
    }

    .volume {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
    }

    .gif-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

    .volume input {
        width: 80px;
    }

    /* STATUS BAR */
    .status-bar {
        height: 22px;
        display: flex;
        align-items: center;
        padding: 0 7px;
        gap: 8px;
        border-top: 1px solid #808080;
        font-size: 10px;
    }

    .status {
        border: 1px solid #808080;
        border-top-color: #404040;
        border-left-color: #404040;
        padding: 2px 6px;
        flex: 1;
    }

    @media (max-width: 560px) {
        .media-player {
            width: calc(100vw - 20px);
        }

        .screen {
            height: 55vw;
            max-height: 285px;
        }
    }
</style>
</head>

<body>

<div class="media-player">

    <!-- BELKA -->
    <div class="title-bar">
        <div class="title-icon">🎵</div>
        <div class="title-text">Windows Media Player</div>

        <div class="window-buttons">
            <button class="window-button">_</button>
            <button class="window-button">□</button>
            <button class="window-button">×</button>
        </div>
    </div>

    <!-- MENU -->
    <div class="menu-bar">
        <span>Plik</span>
        <span>Widok</span>
        <span>Odtwarzanie</span>
        <span>Narzędzia</span>
        <span>Pomoc</span>
    </div>

    <!-- EKRAN Z GIF -->
    <div class="screen">

        <div class="gif-container">

            <!--
                TUTAJ PODAJ ŚCIEŻKĘ DO SWOJEGO GIF-A

                np.
                media/player.gif
            -->

            <img
                src="images/mediagif.gif"
                alt="Animacja odtwarzacza"
                onerror="this.style.display='none'; document.getElementById('gif-placeholder').style.display='block';"
            >

            <div
                class="gif-placeholder"
                id="gif-placeholder"
                style="display:none;"
            >
                [ BRAK PLIKU GIF ]<br>
                <br>
                Wstaw tutaj:<br>
                media/player.gif
            </div>

        </div>

    </div>

    <!-- NAZWA UTWORU -->
    <div class="track-info">
        <div class="track-name" id="trackName">
            In The End - Linkin Park.mp3
        </div>
    </div>

    <!-- POSTĘP -->
    <div class="progress-area">
        <div class="progress-bar">
            <div
                class="progress-fill"
                id="progressFill"
            ></div>
        </div>
    </div>

    <!-- PRZYCISKI -->
    <div class="controls">

        <button
            class="control-button"
            id="playStopButton"
        >
            ▶ START
        </button>

        <button
            class="control-button"
            id="stopButton"
        >
            ■ STOP
        </button>

        <div class="volume">
            🔊
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >
        </div>

    </div>

    <!-- STATUS -->
    <div class="status-bar">

        <div class="status" id="status">
            Gotowy
        </div>

        <div id="time">
            00:00 / 00:00
        </div>

    </div>

</div>


<!-- AUDIO -->
<audio
    id="audio"
    preload="metadata"
    src="audio/InTheEnd.mp3"
></audio>


<script>

    const audio = document.getElementById("audio");

    const playStopButton =
        document.getElementById("playStopButton");

    const stopButton =
        document.getElementById("stopButton");

    const progressFill =
        document.getElementById("progressFill");

    const volume =
        document.getElementById("volume");

    const status =
        document.getElementById("status");

    const time =
        document.getElementById("time");


    /*
     * START / PAUZA
     */

    playStopButton.addEventListener("click", () => {

        if (audio.paused) {

            audio.play()
                .then(() => {

                    playStopButton.textContent =
                        "❚❚ PAUZA";

                    playStopButton.classList.add(
                        "playing"
                    );

                    status.textContent =
                        "Odtwarzanie...";

                })
                .catch(() => {

                    status.textContent =
                        "Nie można odtworzyć pliku audio.";

                });

        } else {

            audio.pause();

            playStopButton.textContent =
                "▶ START";

            playStopButton.classList.remove(
                "playing"
            );

            status.textContent =
                "Wstrzymano";
        }

    });


    /*
     * STOP
     */

    stopButton.addEventListener("click", () => {

        audio.pause();

        audio.currentTime = 0;

        playStopButton.textContent =
            "▶ START";

        playStopButton.classList.remove(
            "playing"
        );

        progressFill.style.width =
            "0%";

        status.textContent =
            "Zatrzymano";

        updateTime();

    });


    /*
     * GŁOŚNOŚĆ
     */

    volume.addEventListener("input", () => {

        audio.volume =
            volume.value;

    });

    audio.volume = 0.8;


    /*
     * PASEK POSTĘPU
     */

    audio.addEventListener("timeupdate", () => {

        if (!audio.duration) return;

        const percent =
            (audio.currentTime /
            audio.duration) * 100;

        progressFill.style.width =
            percent + "%";

        updateTime();

    });


    /*
     * KLIKNIĘCIE W PASEK =
     * PRZEWIŃ UTWÓR
     */

    document
        .querySelector(".progress-bar")
        .addEventListener("click", (event) => {

            if (!audio.duration) return;

            const rect =
                event.currentTarget.getBoundingClientRect();

            const position =
                (event.clientX - rect.left) /
                rect.width;

            audio.currentTime =
                position * audio.duration;

        });


    /*
     * KONIEC UTWORU
     */

    audio.addEventListener("ended", () => {

        playStopButton.textContent =
            "▶ START";

        playStopButton.classList.remove(
            "playing"
        );

        status.textContent =
            "Utwór zakończony";

        progressFill.style.width =
            "0%";

    });


    /*
     * BŁĄD AUDIO
     */

    audio.addEventListener("error", () => {

        status.textContent =
            "ERROR: nie znaleziono audio/InTheEnd.mp3";

    });


    /*
     * CZAS
     */

    function formatTime(seconds) {

        if (!Number.isFinite(seconds)) {
            return "00:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60);

        return (
            String(minutes).padStart(2, "0")
            + ":" +
            String(secs).padStart(2, "0")
        );

    }


    function updateTime() {

        time.textContent =
            formatTime(audio.currentTime)
            + " / "
            + formatTime(audio.duration);

    }


</script>

</body>
</html>
